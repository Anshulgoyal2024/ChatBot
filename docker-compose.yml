services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      LLM_API_KEYS: ${LLM_API_KEYS:-}
      LLM_MODEL: ${LLM_MODEL:-gemini/gemini-3.6-flash}
      DATABASE_URL: sqlite:////data/app.db
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
      ENABLE_FAILURE_SIMULATION: ${ENABLE_FAILURE_SIMULATION:-true}
      LLM_REQUEST_TIMEOUT: ${LLM_REQUEST_TIMEOUT:-30}
      DEFAULT_SYSTEM_PROMPT: ${DEFAULT_SYSTEM_PROMPT:-You are a helpful assistant. Answer clearly and concisely.}
    volumes:
      - sqlite_data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqlite_data:
